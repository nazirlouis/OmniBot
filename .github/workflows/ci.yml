name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # openwakeword pulls tflite-runtime on Linux; PyPI wheels exist for 3.8–3.11 only (not 3.12).
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r app/backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q app/backend
      - name: Board and voice regression checks
        run: |
          pip install httpx
          for test in app/backend/tests/test_*.py; do python "$test" || exit; done
          python scripts/wake_training/test_bounded_validation.py
      - name: Audio and eyes host checks
        run: |
          fw=bots/Waveshare143C
          cc -O2 -fsanitize=address,undefined -I"$fw/main" "$fw/tests/test_face.c" "$fw/main/face_ui.c" "$fw/main/pixel_eyes.c" -lm -o /tmp/face-test
          /tmp/face-test
          cc -O2 -fsanitize=address,undefined -I"$fw/main" "$fw/tests/test_stream.c" "$fw/main/wake_stream.c" -lm -o /tmp/stream-test
          /tmp/stream-test
          cc -O2 -fsanitize=address,undefined -I"$fw/main" "$fw/tests/test_audio_process.c" "$fw/main/audio_process.c" -lm -o /tmp/audio-test
          /tmp/audio-test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install and build
        working-directory: app/frontend
        run: |
          npm ci
          npm run build
